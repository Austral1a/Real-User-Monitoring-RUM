# Production. Copy .env.example to .env and fill in the required values.
#   docker compose up --build

services:
  monitor:
    build:
      context: .
      target: production
    init: true
    ports:
      - "${MONITOR_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      MONITOR_PORT: "4000"
      MONITOR_DB_PATH: /app/data/rum.sqlite
      MONITOR_SITE_ORIGINS: ${MONITOR_SITE_ORIGINS:?Set MONITOR_SITE_ORIGINS in .env}
      MONITOR_DASHBOARD_USER: ${MONITOR_DASHBOARD_USER:?Set MONITOR_DASHBOARD_USER in .env}
      MONITOR_DASHBOARD_PASSWORD: ${MONITOR_DASHBOARD_PASSWORD:?Set MONITOR_DASHBOARD_PASSWORD in .env}
      MONITOR_HASH_SALT: ${MONITOR_HASH_SALT:?Set MONITOR_HASH_SALT in .env}
      MONITOR_TRUST_PROXY: ${MONITOR_TRUST_PROXY:-}
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped

volumes:
  monitor-data:
